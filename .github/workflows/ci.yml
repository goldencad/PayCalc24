name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore PayCalc24.sln
      - run: dotnet build PayCalc24.sln --configuration Release --no-restore
      - run: dotnet test PayCalc24.sln --configuration Release --no-build --logger trx
